name: subscription-proxy

on:
  push:
    branches: [main]
    paths:
      - "llm_log/**"
      - "proxy/**"
      - "tests/test_subscription_proxy.py"
      - "flake.nix"
      - ".github/workflows/subscription-proxy.yml"
  pull_request:
    paths:
      - "llm_log/**"
      - "proxy/**"
      - "tests/test_subscription_proxy.py"
      - "flake.nix"
      - ".github/workflows/subscription-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python subscription/token attribution contract
        run: nix build -L .#checks.x86_64-linux.subscription-proxy-contract
      # The Common Lisp forwarding runtime is not the current Python transport
      # authority. Keep its known Woo/libev lifecycle failure visible without
      # permanently blocking unrelated Python transport delivery; see #107.
      - name: Legacy Common Lisp proxy/config diagnostic
        continue-on-error: true
        run: nix build -L .#checks.x86_64-linux.llm-log-config-contract
