name: subscription-proxy

on:
  push:
    branches: [main, feat/96-subscription-history]
    paths:
      - "llm_log/**"
      - "proxy/**"
      - "tests/**"
      - "flake.nix"
      - ".github/workflows/subscription-proxy.yml"
  pull_request:
    paths:
      - "llm_log/**"
      - "proxy/**"
      - "tests/**"
      - "flake.nix"
      - ".github/workflows/subscription-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python subscription/token attribution contract
        run: nix build -L .#checks.x86_64-linux.subscription-proxy-contract
      - name: Common Lisp proxy/config contract
        run: nix build -L .#checks.x86_64-linux.llm-log-config-contract
