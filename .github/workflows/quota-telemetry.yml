name: Quota telemetry exact-head contract
on:
  pull_request:
    paths:
      - 'llm_log/**'
      - 'tests/**'
      - 'nix/**'
      - 'flake.*'
      - '.github/workflows/quota-telemetry.yml'
  push:
    branches: [feat/79-provider-quota-telemetry]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Full Python regression suite (includes quota contracts)
        run: nix develop --command python -m unittest discover -s tests -v
      - name: Build delivered Python capture package
        run: nix build -L .#llm-log
