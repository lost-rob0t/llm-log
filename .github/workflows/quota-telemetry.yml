name: Quota telemetry exact-head contract
on:
  pull_request:
    paths:
      - 'llm_log/**'
      - 'tests/**'
      - 'nix/**'
      - 'flake.*'
      - '.github/workflows/quota-telemetry.yml'
  push:
    branches: [feat/79-provider-quota-telemetry, feat/96-subscription-history]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Full Python regression suite (includes quota contracts)
        run: nix develop --command python -m unittest discover -s tests -v
      - name: Build delivered Python capture package
        run: |
          nix build -L .#llm-log
          result/bin/llm-log-quotas --help
      - name: Parse Home Manager module
        run: nix-instantiate --parse nix/home-manager.nix >/dev/null
      - name: Evaluate capture and independent quota Home Manager contracts
        run: |
          nix build -L --impure --expr '
            let flake = builtins.getFlake (toString ./.);
                pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
            in pkgs.linkFarm "llm-log-home-manager-contracts" [
              { name = "expert"; path = import ./nix/tests/home-manager-expert.nix {
                  self = flake; inherit pkgs; lib = pkgs.lib;
              }; }
              { name = "quotas"; path = import ./nix/tests/home-manager-quotas.nix {
                  self = flake; inherit pkgs; lib = pkgs.lib;
              }; }
            ]'
