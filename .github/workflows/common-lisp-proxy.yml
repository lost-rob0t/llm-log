name: Common Lisp proxy contracts

on:
  pull_request:
    paths:
      - "proxy/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/common-lisp-proxy.yml"
  push:
    branches:
      - main
    paths:
      - "proxy/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/common-lisp-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Common Lisp proxy contracts
        shell: bash
        run: |
          set -euo pipefail
          nix build -L .#checks.x86_64-linux.llm-log-config-contract

  rate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run independent rate contracts
        shell: bash
        run: |
          set -euo pipefail
          nix shell --no-write-lock-file .#llm-log-cl-sbcl --command \
            sbcl --noinform --no-userinit --no-sysinit --non-interactive \
              --load proxy/tests/rate-runner.lisp
