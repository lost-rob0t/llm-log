name: Expert plane contracts

on:
  push:
    branches:
      - rage/10-expert-runtime-red
      - rage/12-request-classifier-red
      - rage/12-classifier-query-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-lisp-expert-integration-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Tek9 + SWI-Prolog expert contract
        shell: bash
        run: |
          set -euo pipefail
          nix build -L .#checks.x86_64-linux.common-lisp-expert-integration-contract

  python-expert-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Python proxy expert-policy, adapter, transport lifecycle, and launch contracts
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command python -m unittest \
            tests.test_expert_proxy_policy \
            tests.test_expert_adapter \
            tests.test_expert_transport_lifecycle \
            tests.test_expert_launch_config \
            -v

  home-manager-expert-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Home Manager expert wiring contract
        shell: bash
        run: |
          set -euo pipefail
          nix build -L --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
            in
              import ./nix/tests/home-manager-expert.nix {
                self = flake;
                inherit pkgs;
                lib = pkgs.lib;
              }
          '
