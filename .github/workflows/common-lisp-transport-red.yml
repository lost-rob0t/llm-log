name: Expert plane contracts

on:
  push:
    branches:
      - rage/10-expert-runtime-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-lisp-expert-integration-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute #10 Tek9 + SWI-Prolog contract
        shell: bash
        run: |
          set -euo pipefail
          nix build -L .#checks.x86_64-linux.common-lisp-expert-integration-contract

  python-expert-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Python proxy expert-policy and adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command python -m unittest tests.test_expert_proxy_policy tests.test_expert_adapter -v
