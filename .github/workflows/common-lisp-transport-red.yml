name: Common Lisp transport contract

on:
  push:
    branches:
      - rage/10-expert-runtime-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-lisp-transport-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Common Lisp ordinary HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          nix build -L .#checks.x86_64-linux.common-lisp-transport-contract
          echo "COMMON_LISP_HTTP_GREEN: lifecycle and raw HTTP fidelity contract passed"
