name: Common Lisp transport RED

on:
  push:
    branches:
      - rage/10-expert-runtime-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-lisp-transport-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify authoritative contract is behaviorally RED
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/common-lisp-transport-red.log"
          set +e
          nix build -L .#checks.x86_64-linux.common-lisp-transport-contract 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Common Lisp transport contract unexpectedly passed" >&2
            exit 1
          fi

          grep -F "Common Lisp must expose START-HTTP-PROXY" "$log"
          grep -F "Common Lisp must expose STOP-HTTP-PROXY" "$log"
          grep -F "Common Lisp must expose PROXY-LISTEN-PORT" "$log"

          echo "EXPECTED_RED_CONFIRMED: missing Common Lisp HTTP proxy lifecycle"
