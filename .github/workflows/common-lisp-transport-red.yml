name: Common Lisp transport RED

on:
  push:
    branches:
      - rage/10-expert-runtime-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-lisp-transport-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute authoritative Common Lisp transport contract
        run: nix build -L .#checks.x86_64-linux.common-lisp-transport-contract
